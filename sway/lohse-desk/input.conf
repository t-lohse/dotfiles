
input * {
  xkb_layout "us"
  xkb_variant "altgr-intl"
  xkb_model ""
}

input "1356:2508:Sony_Computer_Entertainment_Wireless_Controller_Touchpad" {
    events disabled
    tap enabled
}

input "1133:16534:Logitech_ERGO_M575" {
    #accel_profile flat
    #pointer_accel 0.7
    #scroll_method none
    scroll_factor 0.0
}

